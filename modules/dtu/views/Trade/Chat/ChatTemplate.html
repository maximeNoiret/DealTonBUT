<main class="chat-container">
    <header class="chat-header">
        <a href="/user/account" class="back-btn">← Retour profil</a>
        <h2>Discussion</h2>
    </header>

    <section class="messages-area" id="chat-messages">
        {MESSAGES}
    </section>

    <footer class="chat-footer" style="display: {DISPLAY_FORM};">
        <form method="POST" class="chat-form">
            <input type="hidden" name="id_conv" value="{ID_CONV}">
            <label>
                <textarea name="content" placeholder="Écrivez votre message..." maxlength="500" required></textarea>
            </label>
            <button type="submit">Envoyer</button>
        </form>
    </footer>
</main>

<script src="/_assets/scripts/ChatTemplate.js"></script>
